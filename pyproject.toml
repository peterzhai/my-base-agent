[project]
name = "factory-agent-foundation"
version = "0.1.0"
description = "Offline-first agent foundation and factory knowledge assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "pymysql[rsa]>=1.1,<2",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "cryptography>=44,<47", "python-multipart>=0.0.20,<1",
  "langgraph>=1.0,<2", "faiss-cpu>=1.10,<2", "numpy>=2.1,<3",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
